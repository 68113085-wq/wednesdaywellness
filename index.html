 const B='https://www.gstatic.com/firebasejs/10.14.1/';

 for(const m of[...ALERT_MINUTES,0]){const k=`mww_n_${b.bookingId}_${m}`;

function card(s){const cap=s.capacity||CAPACITY,n=s.bookedCount||0,free=Math.max(0,cap-n),mine=S.mine.some(b=>b.slotId===s.slotId&&ACTIVE.includes(b.status)),pm=s.startTime>='12:00';

document.addEventListener('submit',async e=>{const id=e.target.id;if(!['lf','rf','ff'].includes(id))return;e.preventDefault();const v=i=>$('#'+i).value.trim(),ok=m=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)&&m.endsWith('@'+COMPANY_DOMAIN);
 if(id==='ff'){const em=v('fe').toLowerCase();S.rv={...S.rv,email:em};
  if(!ok(em)){S.loginErr=`ใช้ได้เฉพาะอีเมล @${COMPANY_DOMAIN} เท่านั้น`;return render()}
  if(S.fb)return;S.fb=true;S.loginErr='';render();
  try{await store.reset(em);S.fsent=em}catch(x){if(x.code==='auth/user-not-found')S.fsent=em;else S.loginErr=authMsg(x)}
  S.fb=false;render();return}
 if(id==='lf'){const em=v('em').toLowerCase(),pw=$('#pw').value;S.rv={email:em};
  if(!ok(em)){S.loginErr=`ใช้ได้เฉพาะอีเมล @${COMPANY_DOMAIN} เท่านั้น`;return render()}if(!pw){S.loginErr='กรุณากรอกรหัสผ่าน';return render()}
  S.loginErr='';try{await store.login(em,pw)}catch(x){S.loginErr=authMsg(x);render()}return}
 const p={name:v('rn'),email:v('re').toLowerCase(),department:v('rd'),password:$('#rp').value};S.rv={name:p.name,email:p.email,department:p.department};
 const bad=!p.name?'กรุณากรอกชื่อ-นามสกุล':!ok(p.email)?`ใช้ได้เฉพาะอีเมล @${COMPANY_DOMAIN} เท่านั้น`:!p.department?'กรุณาเลือกแผนก':p.password.length<6?'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร':p.password!==$('#rp2').value?'ยืนยันรหัสผ่านไม่ตรงกัน':'';
 S.loginErr=bad;if(bad)return render();try{await store.register(p)}catch(x){S.loginErr=authMsg(x);console.error(x);render()}});
document.addEventListener('input',e=>{const f=e.target.dataset.pf;if(f)(S.pd||(S.pd={}))[f]=e.target.value});
document.addEventListener('change',async e=>{const t=e.target,a=t.dataset.a;
 if(a==='date'){S.date=t.value;watch();render()}
 else if(a==='month'){S.month=t.value;S.range={slots:[],bookings:[]};watchRange();render()}
 else if(a==='role')store.updateUser(t.dataset.v,{role:t.value}).then(()=>toast('บันทึกบทบาทแล้ว')).catch(()=>toast('บันทึกไม่สำเร็จ','err'))
 else if(t.dataset.pf==='department')S.pd.department=t.value;
 else if(t.id==='pfile'&&t.files[0]){const f=t.files[0];t.value='';if(!f.type.startsWith('image/'))return toast('กรุณาเลือกไฟล์รูปภาพ','err');try{(S.pd||(S.pd={})).photoURL=await thumb(f);render()}catch{toast('อ่านรูปไม่สำเร็จ','err')}}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='SELECT')return;const a=t.dataset.a,v=t.dataset.v;
 if(a==='reg'){S.reg=true;S.forgot=false;S.loginErr='';render()}
 else if(a==='forgot'){const e=$('#em');if(e)S.rv={...S.rv,email:e.value.trim()};S.forgot=true;S.fsent='';S.loginErr='';render()}
 else if(a==='back'){S.reg=false;S.forgot=false;S.fsent='';S.loginErr='';render()}
 else if(a==='eye'){const i=$('#'+v),show=i.type==='password';i.type=show?'text':'password';t.innerHTML=show?IC.eyeoff:IC.eye;t.setAttribute('aria-pressed',show);t.setAttribute('aria-label',show?'ซ่อนรหัสผ่าน':'แสดงรหัสผ่าน')}
 else if(a==='logout'){await store.logout();location.reload()}
 else if(a==='tab'){S.tab=v;if(v==='profile')S.pd={};if(v==='stats')watchRange();render();scrollTo(0,0)}
 else if(a==='day'){S.date=v;watch();render()}
 else if(a==='dis'){S.ntfs=S.ntfs.filter(n=>String(n.id)!==v);rn()}
 else if(a==='perm'){if(!('Notification' in window))return;if(Notification.permission==='denied')toast('เบราว์เซอร์บล็อกการแจ้งเตือน — เปิดได้ที่การตั้งค่าไซต์','err');else{await Notification.requestPermission();render()}}
 else if(a==='test'){notify('ทดสอบ: อีก 15 นาทีถึงคิวนวดของคุณ','นี่คือตัวอย่างการแจ้งเตือนที่จะเด้งก่อนถึงคิว');if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(render)}
 else if(a==='slot'){if(staff(S.user))return;if(mineHere())return toast('คุณมีคิวในวันพุธนี้แล้ว (จองได้ 1 ครั้ง/สัปดาห์)','err');S.sel=v;S.err='';render()}
 else if(a==='close'){if(t.dataset.o&&e.target!==t)return;S.sel=null;S.err='';render()}
 else if(a==='confirm'){const s=slotById(S.sel);if(!s||S.busy)return;S.busy=true;S.err='';render();
  try{await store.book(s,S.user);S.sel=null;S.tab='my';toast(`จองคิวนวดสำเร็จ! รอบ ${s.startTime} - ${s.endTime} น.`)}catch(x){console.error(x);S.err=errMsg(x)}S.busy=false;render()}
 else if(a==='cancel'){const b=nextQ();if(!b||!confirm('ยืนยันยกเลิกคิวนวดนี้? ที่นั่งจะถูกคืนให้เพื่อนพนักงาน'))return;
  try{await store.cancel(b,S.user);toast('ยกเลิกคิวเรียบร้อย','info')}catch(x){toast(errMsg(x),'err')}}
 else if(a==='ci'||a==='ns'){try{await store.setBookingStatus(S.bookings.find(b=>b.id===v),a==='ci'?'checked_in':'no_show');toast(a==='ci'?'เช็กอินเรียบร้อย':'บันทึกเป็นไม่มาตามนัด (No-show)')}catch{toast('อัปเดตไม่สำเร็จ','err')}}
 else if(a==='gen'){try{toast(await store.generate(S.date)?`สร้าง 12 Slots ของ ${thai(S.date,1)} แล้ว`:'วันนี้มีรอบอยู่แล้ว (ไม่สร้างซ้ำ)')}catch{toast('สร้างรอบไม่สำเร็จ','err')}}
 else if(a==='csv')csv();
 else if(a==='pphoto')$('#pfile').click();
 else if(a==='prem'){S.pd.photoURL='';render()}
 else if(a==='pcol'){S.pd.avatarColor=v;render()}
 else if(a==='psave'){const d=S.pd||{},n=(d.name??S.user.name).trim();if(!n)return toast('กรุณากรอกชื่อ','err');
  const data={name:n,department:d.department??S.user.department,phone:(d.phone??S.user.phone??'').trim(),bio:(d.bio??S.user.bio??'').trim(),photoURL:d.photoURL??S.user.photoURL??'',avatarColor:d.avatarColor??S.user.avatarColor??'#047857'};
  try{await store.saveProfile(S.user.uid,data);Object.assign(S.user,data);S.pd={};toast('บันทึกโปรไฟล์แล้ว');render()}catch(x){console.error(x);toast('บันทึกไม่สำเร็จ ('+(x.code||x.message)+')','err')}}});

render();
store.init((u,err)=>{S.reg=false;S.forgot=false;S.user=u;S.loginErr=err||'';S.ready=true;
 if(u){S.tab=staff(u)?'admin':'book';uUnsub&&uUnsub();dataOn=usersOn=false;
  uUnsub=store.subscribeUser(u.uid,d=>{Object.assign(S.user,d);const st=staff(S.user);if(st&&['book','my'].includes(S.tab))S.tab='admin';if(!st&&['admin','stats','users'].includes(S.tab))S.tab='book';startData();render()});startData()}
 render()});
</script>
</body>
</html>
